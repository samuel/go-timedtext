version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nolintlint
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # Tests read and write files in temporary and testdata directories.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - goimports
